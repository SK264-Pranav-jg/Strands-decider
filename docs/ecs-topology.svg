<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <style>
      .box { fill: #fbfcfd; stroke: #c9d1d9; stroke-width: 1.5; }
      .new { fill: #f3f6fe; stroke: #2a5bd7; stroke-width: 2; }
      .back { fill: #e6ebf0; stroke: #c9d1d9; stroke-width: 1.5; }
      .t { font-size: 15px; font-weight: 650; fill: #1b2a3a; }
      .s { font-size: 12.5px; fill: #5d6c7b; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; fill: #1b2a3a; }
      .lab { font-size: 12px; font-weight: 700; letter-spacing: .06em; fill: #5d6c7b; }
      .ln { stroke: #1b2a3a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="790" fill="#eef1f4"/>
  <text x="40" y="44" font-size="22" font-weight="650" fill="#1b2a3a">Deployment topology on Amazon ECS (no GPU)</text>
  <text x="40" y="68" class="s" font-size="14">The decider runs as its own private Fargate service. The agent reaches it through ECS Service Connect.</text>

  <!-- users -->
  <rect class="box" x="36" y="289" width="120" height="64" rx="6"/>
  <text x="96" y="318" class="t" text-anchor="middle">Users</text>
  <text x="96" y="338" class="s" text-anchor="middle" font-size="11.5">HTTPS</text>

  <!-- frames -->
  <rect x="176" y="90" width="1080" height="650" rx="10" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="194" y="114" class="lab">AWS CLOUD · ap-south-1</text>
  <rect x="204" y="128" width="760" height="592" rx="8" fill="#ffffff" stroke="#5d6c7b" stroke-dasharray="6 4"/>
  <text x="220" y="152" class="lab">VPC</text>

  <rect x="224" y="168" width="170" height="532" rx="6" fill="#f6f8fa" stroke="#c9d1d9"/>
  <text x="238" y="190" class="lab">PUBLIC SUBNETS</text>
  <text x="238" y="206" class="s" font-size="11">AZ-a, AZ-b</text>

  <rect x="414" y="168" width="530" height="532" rx="6" fill="#f6f8fa" stroke="#c9d1d9"/>
  <text x="428" y="190" class="lab">PRIVATE SUBNETS</text>
  <text x="428" y="206" class="s" font-size="11">AZ-a, AZ-b · no public IPs</text>

  <line class="ln" x1="156" y1="321" x2="242" y2="321" marker-end="url(#a)"/>
  <!-- ALB -->
  <rect class="box" x="244" y="281" width="130" height="80" rx="6"/>
  <text x="309" y="316" class="t" text-anchor="middle">Application</text>
  <text x="309" y="336" class="t" text-anchor="middle">Load Balancer</text>
  <line class="ln" x1="374" y1="321" x2="438" y2="321" marker-end="url(#a)"/>

  <!-- agent service -->
  <rect class="back" x="448" y="228" width="260" height="176" rx="6"/>
  <rect class="box" x="440" y="236" width="260" height="176" rx="6"/>
  <text x="458" y="264" class="t">Strands agent service</text>
  <text x="458" y="284" class="s">ECS Fargate · existing service</text>
  <text x="458" y="312" class="mono">Agent + DeciderGate hook</text>
  <text x="458" y="332" class="mono">DECIDER_URL=</text>
  <text x="458" y="348" class="mono">  http://decider:9000</text>
  <text x="458" y="376" class="s">security group: agent-sg</text>
  <text x="458" y="396" class="s">scales as it does today</text>

  <!-- service connect -->
  <line class="ln" x1="570" y1="412" x2="570" y2="476" marker-end="url(#a)"/>
  <text x="584" y="438" class="s" font-size="12" font-weight="600" style="fill:#1b2a3a">ECS Service Connect</text>
  <text x="584" y="455" class="mono">POST /v1/systemone</text>

  <!-- decider service -->
  <rect class="back" x="448" y="478" width="260" height="196" rx="6"/>
  <rect class="new" x="440" y="486" width="260" height="196" rx="6"/>
  <text x="458" y="514" class="t">Decider service</text>
  <text x="458" y="534" class="s">ECS Fargate · CPU only · new service</text>
  <text x="458" y="562" class="mono">strands-decider serve :9000</text>
  <text x="458" y="590" class="s">4 vCPU · 12 GB per task</text>
  <text x="458" y="610" class="s">min 2 tasks across AZs</text>
  <text x="458" y="630" class="s">auto scaling on CPU 50–60%</text>
  <text x="458" y="650" class="s">health check: GET /health</text>
  <text x="458" y="670" class="s">security group: decider-sg</text>

  <!-- decider-sg note -->
  <rect x="724" y="486" width="204" height="196" rx="6" fill="#fffaf0" stroke="#d9c8a0"/>
  <text x="740" y="514" class="t" font-size="14">decider-sg rules</text>
  <text x="740" y="540" class="s">inbound :9000 only</text>
  <text x="740" y="558" class="s">from agent-sg</text>
  <text x="740" y="584" class="s">no public IP</text>
  <text x="740" y="606" class="s">egress only to VPC endpoints</text>
  <text x="740" y="624" class="s">(ECR, S3, CloudWatch Logs)</text>
  <text x="740" y="646" class="s">weights baked into image</text>
  <text x="740" y="668" class="mono">HF_HUB_OFFLINE=1</text>

  <!-- bedrock path -->
  <line class="ln" x1="700" y1="321" x2="922" y2="321" marker-end="url(#a)"/>
  <text x="812" y="300" class="s" text-anchor="middle" font-size="11.5">only messages that</text>
  <text x="812" y="314" class="s" text-anchor="middle" font-size="11.5">pass the gate</text>
  <rect x="924" y="306" width="80" height="30" rx="15" fill="#ffffff" stroke="#1b2a3a"/>
  <text x="964" y="325" text-anchor="middle" font-size="11" fill="#1b2a3a">VPC endpoint</text>
  <line class="ln" x1="1004" y1="321" x2="1018" y2="321" marker-end="url(#a)"/>

  <!-- aws services -->
  <rect class="box" x="1020" y="281" width="216" height="80" rx="6"/>
  <text x="1036" y="312" class="t">Amazon Bedrock</text>
  <text x="1036" y="334" class="s">Claude Haiku 4.5</text>

  <text x="1020" y="414" class="lab">SUPPORTING SERVICES</text>
  <rect class="box" x="1020" y="426" width="216" height="80" rx="6"/>
  <text x="1036" y="456" class="t">Amazon ECR</text>
  <text x="1036" y="478" class="s">agent image</text>
  <text x="1036" y="496" class="s">decider image (~10 GB)</text>

  <rect class="box" x="1020" y="522" width="216" height="100" rx="6"/>
  <text x="1036" y="552" class="t">Amazon CloudWatch</text>
  <text x="1036" y="574" class="s">logs + Container Insights</text>
  <text x="1036" y="594" class="s">score · blocked · latency</text>
  <text x="1036" y="612" class="s">never the message text</text>

  <text x="40" y="770" class="s" font-size="13">Blocked messages stop at the agent: the hook answers them and they never reach Bedrock. Blue = new; everything else already exists.</text>
</svg>
