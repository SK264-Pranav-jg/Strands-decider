<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5294e"/>
    </marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7f82"/>
    </marker>
    <style>
      .box { fill: #fbfcfd; stroke: #c9d1d9; stroke-width: 1.5; }
      .new { fill: #f3f6fe; stroke: #2a5bd7; stroke-width: 2; }
      .t { font-size: 15px; font-weight: 650; fill: #1b2a3a; }
      .s { font-size: 12.5px; fill: #5d6c7b; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1b2a3a; }
      .band { fill: #ffffff; stroke: #c9d1d9; }
      .lab { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #5d6c7b; }
      .ln { stroke: #1b2a3a; stroke-width: 1.5; fill: none; }
      .pill { fill: #2a5bd7; }
      .pt { font-size: 10px; font-weight: 700; fill: #fff; letter-spacing: .06em; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#eef1f4"/>
  <text x="40" y="44" font-size="22" font-weight="650" fill="#1b2a3a">Adding the decider gate to an existing Strands agent</text>
  <text x="40" y="68" class="s" font-size="14">Only the blue parts are new. Your model, tools and prompts stay as they are.</text>

  <!-- BEFORE -->
  <rect class="band" x="24" y="88" width="1232" height="122" rx="10"/>
  <text x="44" y="114" class="lab">BEFORE</text>
  <rect class="box" x="60" y="128" width="170" height="60" rx="6"/>
  <text x="145" y="163" class="t" text-anchor="middle">User message</text>
  <rect class="box" x="300" y="128" width="240" height="60" rx="6"/>
  <text x="420" y="153" class="t" text-anchor="middle">Strands Agent</text>
  <text x="420" y="173" class="mono" text-anchor="middle">Agent(model, tools, prompt)</text>
  <rect class="box" x="610" y="128" width="220" height="60" rx="6"/>
  <text x="720" y="153" class="t" text-anchor="middle">Amazon Bedrock</text>
  <text x="720" y="173" class="s" text-anchor="middle">every message reaches the LLM</text>
  <rect class="box" x="900" y="128" width="180" height="60" rx="6"/>
  <text x="990" y="163" class="t" text-anchor="middle">Reply</text>
  <line class="ln" x1="230" y1="158" x2="298" y2="158" marker-end="url(#a)"/>
  <line class="ln" x1="540" y1="158" x2="608" y2="158" marker-end="url(#a)"/>
  <line class="ln" x1="830" y1="158" x2="898" y2="158" marker-end="url(#a)"/>

  <!-- AFTER -->
  <rect class="band" x="24" y="228" width="1232" height="472" rx="10"/>
  <text x="44" y="254" class="lab">AFTER</text>

  <rect class="box" x="60" y="280" width="170" height="70" rx="6"/>
  <text x="145" y="320" class="t" text-anchor="middle">User message</text>

  <rect class="new" x="290" y="280" width="250" height="70" rx="6"/>
  <text x="415" y="308" class="t" text-anchor="middle">Strands Agent</text>
  <text x="415" y="330" class="mono" text-anchor="middle">Agent(..., hooks=[DeciderGate()])</text>

  <rect class="new" x="600" y="280" width="260" height="70" rx="6"/>
  <rect class="pill" x="612" y="270" width="40" height="18" rx="9"/>
  <text x="632" y="283" class="pt" text-anchor="middle">NEW</text>
  <text x="730" y="308" class="t" text-anchor="middle">DeciderGate hook</text>
  <text x="730" y="330" class="mono" text-anchor="middle">on BeforeInvocationEvent</text>

  <rect class="new" x="930" y="280" width="290" height="70" rx="6"/>
  <rect class="pill" x="942" y="270" width="40" height="18" rx="9"/>
  <text x="962" y="283" class="pt" text-anchor="middle">NEW</text>
  <text x="1075" y="308" class="t" text-anchor="middle">Decider service</text>
  <text x="1075" y="330" class="mono" text-anchor="middle">POST /v1/systemone → noul</text>

  <line class="ln" x1="230" y1="315" x2="288" y2="315" marker-end="url(#a)"/>
  <line class="ln" x1="540" y1="315" x2="598" y2="315" marker-end="url(#a)"/>
  <line class="ln" x1="860" y1="300" x2="928" y2="300" marker-end="url(#a)"/>
  <line class="ln" x1="928" y1="332" x2="862" y2="332" marker-end="url(#a)"/>
  <text x="895" y="293" class="s" text-anchor="middle" font-size="11">message</text>
  <text x="895" y="347" class="s" text-anchor="middle" font-size="11">score</text>

  <!-- decision -->
  <line class="ln" x1="730" y1="350" x2="730" y2="388" marker-end="url(#a)"/>
  <polygon points="730,390 840,445 730,500 620,445" fill="#fbfcfd" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="730" y="441" class="t" text-anchor="middle" font-size="14">score ≥</text>
  <text x="730" y="459" class="t" text-anchor="middle" font-size="14">threshold?</text>

  <!-- yes: blocked -->
  <line x1="840" y1="445" x2="928" y2="445" stroke="#b5294e" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="884" y="437" font-size="13" font-weight="700" fill="#b5294e" text-anchor="middle">yes</text>
  <rect x="930" y="400" width="290" height="96" rx="6" fill="#fdf3f6" stroke="#b5294e" stroke-width="2"/>
  <text x="946" y="426" class="t" fill="#b5294e" style="fill:#b5294e">Blocked</text>
  <text x="946" y="447" class="s">event.cancel → user gets the block message</text>
  <text x="946" y="466" class="s">Bedrock is never called</text>
  <text x="946" y="485" class="s">PII is not saved in the agent's history</text>

  <!-- fail closed -->
  <line x1="1190" y1="350" x2="1190" y2="398" stroke="#b5294e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aRed)"/>
  <text x="1180" y="379" font-size="11.5" fill="#b5294e" text-anchor="end">error or timeout → fail closed</text>

  <!-- no: bedrock -->
  <line x1="730" y1="500" x2="730" y2="558" stroke="#0f7f82" stroke-width="2" marker-end="url(#aTeal)"/>
  <text x="744" y="535" font-size="13" font-weight="700" fill="#0f7f82">no</text>
  <rect class="box" x="600" y="560" width="260" height="66" rx="6"/>
  <text x="730" y="588" class="t" text-anchor="middle">Amazon Bedrock</text>
  <text x="730" y="609" class="s" text-anchor="middle">unchanged LLM call</text>
  <rect class="box" x="930" y="560" width="290" height="66" rx="6"/>
  <text x="1075" y="598" class="t" text-anchor="middle">Reply to user</text>
  <line class="ln" x1="860" y1="593" x2="928" y2="593" marker-end="url(#a)"/>

  <!-- what changes -->
  <rect class="box" x="60" y="385" width="490" height="290" rx="8"/>
  <text x="84" y="416" class="t">What changes in your code</text>
  <g font-size="13.5" fill="#1b2a3a">
    <text x="84" y="448"><tspan fill="#2a5bd7" font-weight="700">+  </tspan>A DeciderGate hook class (about 40 lines)</text>
    <text x="84" y="474"><tspan fill="#2a5bd7" font-weight="700">+  </tspan><tspan font-family="ui-monospace, Menlo, monospace" font-size="12.5">hooks=[DeciderGate()]</tspan> where you create the Agent</text>
    <text x="84" y="500"><tspan fill="#2a5bd7" font-weight="700">+  </tspan><tspan font-family="ui-monospace, Menlo, monospace" font-size="12.5">DECIDER_URL</tspan> env var in the ECS task definition</text>
  </g>
  <text x="84" y="542" class="t">Unchanged</text>
  <g font-size="13.5" fill="#1b2a3a">
    <text x="84" y="572"><tspan fill="#0f7f82" font-weight="700">✓  </tspan>Model, tools and system prompt</text>
    <text x="84" y="598"><tspan fill="#0f7f82" font-weight="700">✓  </tspan>Session and conversation handling</text>
    <text x="84" y="624"><tspan fill="#0f7f82" font-weight="700">✓  </tspan>Bedrock permissions and configuration</text>
    <text x="84" y="650"><tspan fill="#0f7f82" font-weight="700">✓  </tspan>How users call your agent</text>
  </g>
</svg>
