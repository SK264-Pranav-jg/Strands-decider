[project]
name = "acme-support-gate"
version = "0.1.0"
description = "Acme Electronics support orchestrator behind a strands-decider admission gate"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "strands-agents>=1.58.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
